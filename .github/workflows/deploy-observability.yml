name: Deploy Observability Stack

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Observability Config"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Trigger Dokploy deployment
        run: curl --fail -X POST "${{ secrets.DOKPLOY_OBSERVABILITY_WEBHOOK_URL }}"
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    permissions: {}
    timeout-minutes: 15
    env:
      API: ${{ secrets.SMOKE_API_URL }}
      WEB: ${{ secrets.SMOKE_FRONTEND_URL }}
      EXPECTED_VERSION: ${{ github.sha }}

    steps:
      # Only needed if the URLs are reachable only over the tailnet
      # - name: Connect to Tailscale
      #   uses: tailscale/github-action@v3
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      #     tags: tag:ci

      # The Dokploy webhook returns before the new containers are up,
      # so wait until /version reports this commit.
      - name: Wait for new version to go live
        run: |
          for i in $(seq 1 40); do
            v=$(curl -fsS --max-time 5 "$API/version" | jq -r .version 2>/dev/null || true)
            if [ "$v" = "$EXPECTED_VERSION" ]; then echo "Live: $v"; exit 0; fi
            echo "Attempt $i: serving '$v', waiting..."
            sleep 15
          done
          echo "::error::Version $EXPECTED_VERSION never went live"
          exit 1

      - name: API is live
        run: curl -fsS --max-time 5 "$API/health/live"

      # postgres + rabbitmq + identity (roles seeded, JWT signing works)
      - name: API is ready
        run: |
          curl -sS --max-time 15 --retry 5 --retry-delay 5 --retry-all-errors \
            -o ready.json -w "%{http_code}" "$API/health/ready" > code.txt || true
          cat ready.json; echo
          [ "$(cat code.txt)" = "200" ] || { echo "::error::/health/ready returned $(cat code.txt)"; exit 1; }

      - name: Frontend serves the app
        run: |
          curl -fsS --max-time 10 "$WEB/" | grep -q "<app-root"
          # deep links must fall back to index.html via nginx
          code=$(curl -s -o /dev/null -w "%{http_code}" "$WEB/dashboard")
          [ "$code" = "200" ] || { echo "::error::/dashboard returned $code"; exit 1; }
