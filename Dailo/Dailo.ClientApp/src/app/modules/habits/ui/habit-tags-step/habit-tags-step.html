<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-2">
    <label for="tags" class="block">
      Tags
      <span class="text-sm font-normal text-surface-400">(optional)</span>
    </label>
    <p-multiselect [formControl]="formGroup().controls.tagIds"
                   [options]="tagSelectItems()"
                   [invalid]="!!formGroup().controls.tagIds.getError('serverError')"
                   appendTo="body"
                   name="tags"
                   inputId="tags"
                   optionLabel="label"
                   optionValue="value"
                   placeholder="Select tags"
                   display="chip"
                   fluid />
    @if (formGroup().controls.tagIds.getError('serverError'); as serverError) {
      <small class="text-sm text-red-500 mt-1">{{ serverError }}</small>
    }
  </div>
</div>
