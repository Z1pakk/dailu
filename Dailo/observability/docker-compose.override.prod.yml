name: dailu-observability

services:
  otel-collector-storage-init:
    image: busybox
    restart: "no"
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/otelcol/file_storage"]
    volumes:
      - otel-collector-storage:/var/lib/otelcol/file_storage

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    restart: unless-stopped
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - otel-collector-storage:/var/lib/otelcol/file_storage
    depends_on:
      otel-collector-storage-init:
        condition: service_completed_successfully
    networks:
      - default
      - dokploy-network

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - default
      - dokploy-network

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - default
      - dokploy-network

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - default
      - dokploy-network

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3100:3000"
    networks:
      - default
      - dokploy-network
    depends_on:
      - tempo
      - prometheus
      - loki

networks:
  dokploy-network:
    external: true

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
  otel-collector-storage: