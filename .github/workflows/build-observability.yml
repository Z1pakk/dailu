name: Build Observability Config

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dailo/observability/**"

env:
  REGISTRY: ghcr.io
  OBSERVABILITY_CONFIG_IMAGE: ghcr.io/${{ github.repository_owner }}/dailo-observability-config

jobs:
  build-and-push:
    name: Build & Push Observability Config Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: |
          echo "OBSERVABILITY_CONFIG_IMAGE=${OBSERVABILITY_CONFIG_IMAGE,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push observability config image
        uses: docker/build-push-action@v6
        with:
          context: ./Dailo/observability
          file: ./Dailo/observability/Dockerfile
          push: true
          tags: |
            ${{ env.OBSERVABILITY_CONFIG_IMAGE }}:latest
            ${{ env.OBSERVABILITY_CONFIG_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
