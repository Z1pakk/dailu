# sshd for Rider's SSH remote development. There is no network listener: each connection starts its own
# "sshd -i" through "docker exec" (the ProxyCommand in your ~/.ssh/config), so only someone who can run
# docker on your PC can connect. Included before the defaults in sshd_config, so these values win.
AllowUsers dev
PermitRootLogin no
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
# Your PC's SSH agent and X server never reach the container
AllowAgentForwarding no
X11Forwarding no
# Rider's client reaches its backend through local forwarding; nothing else is forwarded
AllowTcpForwarding local
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no
# PAM loads /etc/environment (written by setup-root.sh), so sessions get the container's proxy and app settings
UsePAM yes
PrintMotd no
