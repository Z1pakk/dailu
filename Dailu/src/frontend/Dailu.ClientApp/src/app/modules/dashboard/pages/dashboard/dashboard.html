<header class="dash-header">
  <div class="dash-title">
    <h1>{{ $greeting() }}</h1>
    <p class="dl-body">{{ $subtitle() }}</p>
  </div>

  <div class="dash-actions">
    <!-- Search and notifications have no backend yet: placeholders. -->
    <span class="dash-search" pTooltip="Coming soon" tooltipPosition="bottom">
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="search" placeholder="Search habits, entries…" aria-label="Search" [disabled]="true" />
      </p-iconfield>
      <kbd class="dl-mono-sm dash-kbd">⌘K</kbd>
    </span>
    <span pTooltip="Coming soon" tooltipPosition="bottom">
      <p-button icon="pi pi-bell" [rounded]="true" [outlined]="true" severity="secondary"
                ariaLabel="Notifications" [disabled]="true" />
    </span>
    <a pButton routerLink="/app/habits" [queryParams]="{ new: 1 }" icon="pi pi-plus" label="New habit"></a>
  </div>
</header>

<div class="dash-grid">
  <app-today-card class="dash-today"
                  [habits]="$today()"
                  [pendingIds]="$pendingIds()"
                  (check)="checkOff($event)" />
  <app-streak-card class="dash-streak" [streak]="$streak()" [week]="$week()" />
  <app-consistency-card class="dash-consistency"
                        [weeks]="$heatWeeks()"
                        [habitsPerDay]="$habitsPerDay()"
                        [fullyDone]="$heatSummary().fullyDone"
                        [days]="$heatSummary().days"
                        [cellSize]="$heatCellSize()" />
  <app-integrations-card class="dash-integrations" [integrations]="$integrations()" />
  <app-milestones-card class="dash-milestones" [milestones]="$milestones()" />
  <app-recent-activity-card class="dash-activity" [entries]="entries()" />
  <app-ai-insights-card class="dash-ai" />
</div>

<app-coach-button />
