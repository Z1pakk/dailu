@let row = $row();
<article class="row">
  <button type="button" class="row-main" [attr.aria-label]="'Edit ' + row.habit.name" (click)="edit.emit()">
    <svg class="habit-ring" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <circle class="ring-track" cx="20" cy="20" [attr.r]="ringRadius" />
      @if ($ringShare() > 0) {
        <!-- Starts at 12 o'clock and runs clockwise. -->
        <circle class="ring-fill" cx="20" cy="20" [attr.r]="ringRadius" transform="rotate(-90 20 20)"
                [attr.stroke-dasharray]="ringLength" [attr.stroke-dashoffset]="$ringOffset()" />
      }
      @if ($ringLabel(); as label) {
        <text class="ring-label" x="20" y="20" text-anchor="middle" dominant-baseline="central">{{ label }}</text>
      }
    </svg>
    <span class="info">
      <span class="name">{{ row.habit.name }}</span>
      <span class="dl-mono-sm schedule">{{ row.scheduleLabel }}</span>
    </span>
  </button>

  <span class="source" [class.is-auto]="row.isAutomated">{{ row.sourceLabel }}</span>

  <span class="spacer"></span>

  <ol class="week" aria-label="This week">
    @for (dot of row.dots; track dot.day) {
      <li class="dot" [class]="'dot is-' + dot.state" [attr.aria-label]="dotLabel(dot)"></li>
    }
  </ol>

  <span class="streak">
    <span class="streak-count">{{ row.streak.count }}</span>
    <span class="dl-mono-sm streak-label">{{ $streakLabel() }}</span>
  </span>

  <span class="milestone">
    @if (row.milestone; as milestone) {
      <span class="milestone-head">
        <span class="milestone-label">{{ milestone.label }}</span>
        <span class="dl-mono-sm">{{ milestone.current }}/{{ milestone.target }}</span>
      </span>
      <svg class="bar" width="100%" height="6" role="progressbar" [attr.aria-valuenow]="milestone.percent"
           aria-valuemin="0" aria-valuemax="100" [attr.aria-label]="milestone.label">
        <rect class="bar-track" width="100%" height="6" rx="3" />
        <rect class="bar-fill" [attr.width]="milestone.percent + '%'" height="6" rx="3" />
      </svg>
    }
  </span>

  <p-button icon="pi pi-ellipsis-h" severity="secondary" [text]="true" styleClass="more"
            [ariaLabel]="'Actions for ' + row.habit.name" (onClick)="menu.toggle($event)" />
  <p-menu #menu [model]="menuItems" [popup]="true" appendTo="body" />
</article>
