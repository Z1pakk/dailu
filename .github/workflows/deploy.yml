name: Deploy

on:
  workflow_dispatch: 
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/dailo-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/dailo-frontend
  MIGRATIONS_IMAGE: ghcr.io/${{ github.repository_owner }}/dailo-migrations-runner

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image names
        run: |
          echo "API_IMAGE=${API_IMAGE,,}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE,,}" >> $GITHUB_ENV
          echo "MIGRATIONS_IMAGE=${MIGRATIONS_IMAGE,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./Dailu
          file: ./Dailu/src/api/Dailu.Api/Dockerfile
          target: final
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Dailu/src/frontend/Dailu.ClientApp
          file: ./Dailu/src/frontend/Dailu.ClientApp/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrations-runner image
        uses: docker/build-push-action@v6
        with:
          context: ./Dailu
          file: ./Dailu/src/Dailu.MigrationsRunner/Dockerfile
          push: true
          tags: |
            ${{ env.MIGRATIONS_IMAGE }}:latest
            ${{ env.MIGRATIONS_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Joins the runner to the tailnet as a short-lived, single-use node (the
      # OAuth client is exchanged for an ephemeral auth key at runtime - no
      # standing VPN key lives in secrets). step-ca (8443) and sshd (22) are
      # firewalled to only accept connections from the tailnet CIDR, so this
      # has to succeed before either is reachable at all.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      # Exchanges a provisioner secret (name + password, like an OAuth client
      # id/secret) for a one-time token, then exchanges that for an SSH
      # certificate valid ~10 minutes from our self-hosted step-ca. The cert's
      # force-command restricts the session to /opt/ci-scripts/run-migrations.sh
      # regardless of what's requested, and that script itself only accepts a
      # validated git-sha - so the provisioner password only ever grants a
      # short-lived, narrowly-scoped capability, not direct server access.
      # This step's exit code IS the container's actual exit code (docker run is
      # invoked directly on the server) - no separate status polling needed.
      - name: Install step CLI
        env:
          STEP_CLI_VERSION: "0.30.6"
        run: |
          curl -fsSL -O \
            "https://github.com/smallstep/cli/releases/download/v${STEP_CLI_VERSION}/step_linux_${STEP_CLI_VERSION}_amd64.tar.gz"
          curl -fsSL -o checksums.txt \
            "https://github.com/smallstep/cli/releases/download/v${STEP_CLI_VERSION}/checksums.txt"
          grep " step_linux_${STEP_CLI_VERSION}_amd64.tar.gz$" checksums.txt | sha256sum -c -
          tar -xzf "step_linux_${STEP_CLI_VERSION}_amd64.tar.gz"
          sudo mv "step_${STEP_CLI_VERSION}/bin/step" /usr/local/bin/step
          rm -rf "step_linux_${STEP_CLI_VERSION}_amd64.tar.gz" checksums.txt "step_${STEP_CLI_VERSION}"
          step version

      # The CA's root certificate isn't sensitive (that's the point of a CA -
      # clients need it to verify what the CA signs); this just confirms we're
      # actually talking to our CA and not an impostor, via its fingerprint.
      - name: Bootstrap trust in step-ca
        run: |
          step ca bootstrap --ca-url "${{ secrets.DOKPLOY_CA_URL }}" \
            --fingerprint "${{ secrets.DOKPLOY_CA_FINGERPRINT }}" --force

      - name: Get a short-lived SSH certificate from step-ca
        run: |
          echo "${{ secrets.DOKPLOY_CA_PROVISIONER_PASSWORD }}" > /tmp/provisioner-pass.txt
          TOKEN=$(step ca token ci-migrate --ssh \
            --provisioner ci-migrate-provisioner \
            --provisioner-password-file /tmp/provisioner-pass.txt \
            --ca-url "${{ secrets.DOKPLOY_CA_URL }}")
          step ssh certificate --token "$TOKEN" \
            --not-after 10m \
            --no-password --insecure --no-agent \
            ci-migrate /tmp/ci_ephemeral
          rm -f /tmp/provisioner-pass.txt

      - name: Run migrations over certificate-authenticated SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DOKPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          IMAGE="${{ env.MIGRATIONS_IMAGE }}:${{ github.sha }}"
          IMAGE="${IMAGE,,}"

          ssh -i /tmp/ci_ephemeral \
            "ci-migrate@${{ secrets.DOKPLOY_SSH_HOST }}" \
            "run-migrations $IMAGE"

          rm -f /tmp/ci_ephemeral /tmp/ci_ephemeral.pub /tmp/ci_ephemeral-cert.pub

  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Trigger Dokploy deployment
        run: curl --fail -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    permissions: {}
    timeout-minutes: 15
    env:
      # Frontend and API share one host; the API is everything under /api
      BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
      EXPECTED_VERSION: ${{ github.sha }}
      # Optional: a Cloudflare WAF "Skip" rule matching this header lets the runner past bot checks.
      SMOKE_TOKEN: ${{ secrets.SMOKE_BYPASS_TOKEN }}

    steps:
      # Only needed if the URL is reachable only over the tailnet
      # - name: Connect to Tailscale
      #   uses: tailscale/github-action@v3
      #   with:
      #     oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      #     oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      #     tags: tag:ci

      # Strips whitespace/CR (easy to paste into a secret) and a trailing slash, then
      # validates, so a bad secret fails here instead of as curl errors in later steps.
      # Also writes the shared request helper every later step sources.
      - name: Resolve URLs
        run: |
          base=$(printf '%s' "$BASE_URL" | tr -d '[:space:]')
          base="${base%/}"
          base="${base%/api}"   # the job adds /api itself
          if [ -z "$base" ]; then
            echo "::error::SMOKE_BASE_URL secret is not set"; exit 1
          fi
          if printf '%s' "$BASE_URL" | grep -q '[[:space:]]'; then
            echo "::warning::SMOKE_BASE_URL contained whitespace or a newline - stripped it; consider re-saving the secret"
          fi
          if ! printf '%s' "$base" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[^?#]*)?$'; then
            echo "::error::SMOKE_BASE_URL must look like https://dailu.dev (scheme + host)"; exit 1
          fi
          echo "WEB=$base" >> "$GITHUB_ENV"
          echo "API=$base/api" >> "$GITHUB_ENV"
          [ -n "$SMOKE_TOKEN" ] || echo "::notice::SMOKE_BYPASS_TOKEN not set - requests carry no Cloudflare bypass header"

          cat > "$RUNNER_TEMP/smoke.sh" <<'SH'
          # fetch URL -> sets CODE, BODY, KIND (json | spa | cloudflare | html | other) and logs on anything unexpected.
          fetch() {
            local url="$1" hdr="$RUNNER_TEMP/headers.txt"
            local args=(-sS --max-time 10 -A "dailu-smoke-test (+github-actions)" -D "$hdr" -o "$RUNNER_TEMP/body.txt" -w "%{http_code}")
            [ -n "$SMOKE_TOKEN" ] && args+=(-H "X-Smoke-Token: $SMOKE_TOKEN")
            CODE=$(curl "${args[@]}" "$url") || CODE="curl-$?"
            BODY=$(cat "$RUNNER_TEMP/body.txt" 2>/dev/null || true)
            local server mitigated
            server=$(grep -i '^server:' "$hdr" 2>/dev/null | tr -d '\r' | cut -d' ' -f2- || true)
            mitigated=$(grep -i '^cf-mitigated:' "$hdr" 2>/dev/null | tr -d '\r' | cut -d' ' -f2- || true)
            case "$BODY" in
              "{"*|"["*) KIND=json ;;
              *"<app-root"*) KIND=spa ;;
              "<"*)
                if [ -n "$mitigated" ] || { [ "${server,,}" = "cloudflare" ] && [[ "$CODE" =~ ^(403|429|503)$ ]]; }; then KIND=cloudflare; else KIND=html; fi ;;
              *) KIND=other ;;
            esac
            if [ "$KIND" != json ]; then
              echo "  $url -> status=$CODE server=${server:-?} cf-mitigated=${mitigated:-none} kind=$KIND"
              echo "  body: $(printf '%s' "$BODY" | tr -d '\n' | head -c 200)"
            fi
          }
          explain() {
            case "$KIND" in
              cloudflare) echo "::error::Cloudflare blocked or challenged the runner ($CODE). Add a WAF Skip rule for header X-Smoke-Token and set SMOKE_BYPASS_TOKEN, or run the smoke test over Tailscale." ;;
              spa) echo "::error::$1 returned the frontend's index.html - /api is not routed to the API" ;;
              *) echo "::error::$1 returned $CODE ($KIND), expected JSON" ;;
            esac
          }
          SH

      # The Dokploy webhook returns before the new containers are up,
      # so wait until /api/version reports this commit.
      - name: Wait for new version to go live
        run: |
          source "$RUNNER_TEMP/smoke.sh"
          for i in $(seq 1 40); do
            fetch "$API/version"
            # 3 = malformed URL: retrying can't help
            [ "$CODE" != "curl-3" ] || { echo "::error::curl rejected the URL - check SMOKE_BASE_URL"; exit 1; }
            # A challenge page won't go away by waiting; a mis-route won't either
            case "$KIND" in
              cloudflare|spa) explain "$API/version"; exit 1 ;;
            esac
            v=$(printf '%s' "$BODY" | jq -r .version 2>/dev/null || true)
            if [ "$v" = "$EXPECTED_VERSION" ]; then echo "Live: $v"; exit 0; fi
            echo "Attempt $i: serving '${v:-?}' ($CODE), waiting..."
            sleep 15
          done
          echo "::error::Version $EXPECTED_VERSION never went live"
          exit 1

      # check the body, not just the status: a mis-routed path gets the SPA's index.html with a 200
      - name: API is live
        run: |
          source "$RUNNER_TEMP/smoke.sh"
          fetch "$API/health/live"
          [ "$KIND" = json ] || { explain "$API/health/live"; exit 1; }
          printf '%s' "$BODY" | jq -e '.status == "Healthy"'

      # postgres + rabbitmq + identity (roles seeded, JWT signing works); a 503 body still shows which check failed
      - name: API is ready
        run: |
          source "$RUNNER_TEMP/smoke.sh"
          for i in $(seq 1 5); do
            fetch "$API/health/ready"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          printf '%s\n' "$BODY"
          [ "$KIND" = json ] || { explain "$API/health/ready"; exit 1; }
          [ "$CODE" = "200" ] || { echo "::error::$API/health/ready returned $CODE"; exit 1; }
          printf '%s' "$BODY" | jq -e '.status == "Healthy"' > /dev/null

      - name: Frontend serves the app
        run: |
          source "$RUNNER_TEMP/smoke.sh"
          for path in / /login; do  # deep links must fall back to index.html via nginx
            fetch "$WEB$path"
            [ "$CODE" = "200" ] && [ "$KIND" = spa ] || { [ "$KIND" = cloudflare ] && explain "$WEB$path" || echo "::error::$WEB$path returned $CODE ($KIND)"; exit 1; }
          done
