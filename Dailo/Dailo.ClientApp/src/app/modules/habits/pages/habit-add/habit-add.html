<form [formGroup]="addHabitForm" class="flex flex-col gap-4" novalidate>
  <app-habit-form-wizard [steps]="wizardSteps" [(activeIndex)]="activeStepIndex" [nextDisabled]="!canGoNext()">
    @if (activeStepIndex() === 0) {
      <app-habit-general-step [formGroup]="addHabitForm" />
    }
    @if (activeStepIndex() === 1) {
      <app-habit-schedule-step [formGroup]="addHabitForm" />
    }
    @if (activeStepIndex() === 2) {
      <app-habit-automation-step
        [formGroup]="addHabitForm"
        [githubRepoSelectItems]="$githubRepoSelectItems()"
        [githubReposLoading]="$githubReposLoading()"
      />
    }
    @if (activeStepIndex() === 3) {
      <app-habit-tags-step [formGroup]="addHabitForm" [tagSelectItems]="$tagSelectItems()" />
    }
  </app-habit-form-wizard>
</form>
