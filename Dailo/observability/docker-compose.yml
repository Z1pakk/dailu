name: dailu-observability

services:
  otel-collector-storage-init:
    image: busybox
    command: ["sh", "-c", "chown -R 10001:10001 /var/lib/otelcol/file_storage"]
    volumes:
      - otel-collector-storage:/var/lib/otelcol/file_storage

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - otel-collector-storage:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      tempo:
        condition: service_started
      otel-collector-storage-init:
        condition: service_completed_successfully

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3102:3200"

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "3103:9090"
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:3.7.6
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3101:3100"

  grafana:
    image: grafana/grafana:13.1.3
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3100:3000"
    depends_on:
      - tempo
volumes:
  tempo-data:
  grafana-data:
  otel-collector-storage:
  prometheus-data:
  loki-data: