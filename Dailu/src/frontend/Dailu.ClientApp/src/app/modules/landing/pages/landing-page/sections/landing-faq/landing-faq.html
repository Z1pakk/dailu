<section id="faq" class="landing-section landing-section--surface">
  <div class="section-inner">
    <app-section-header class="reveal" eyebrow="FAQ" title="Questions, answered." />

    <p-accordion value="0" class="faq reveal" [dt]="accordionTokens">
      @for (item of items; track item.question) {
        <p-accordion-panel [value]="'' + $index">
          <p-accordion-header>
            <span class="faq-question">{{ item.question }}</span>
            <ng-template #toggleicon let-active="active">
              <i [class]="'faq-icon ' + (active ? 'pi pi-minus' : 'pi pi-plus')" aria-hidden="true"></i>
            </ng-template>
          </p-accordion-header>
          <p-accordion-content>
            <p class="faq-answer">{{ item.answer }}</p>
          </p-accordion-content>
        </p-accordion-panel>
      }
    </p-accordion>
  </div>
</section>
