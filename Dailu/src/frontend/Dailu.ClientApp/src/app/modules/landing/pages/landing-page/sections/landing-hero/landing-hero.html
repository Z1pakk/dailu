<section class="hero landing-section--canvas" aria-labelledby="hero-title">
  <div class="section-inner hero-inner">
    <span class="hero-tag">A study &amp; pet project</span>
    <h1 id="hero-title" class="hero-title dl-h1">
      Your day rises with your habits.<br />
      Dailu checks them off.
    </h1>
    <p class="hero-lead dl-body-lg">
      Place each habit on today’s arc. When your apps confirm it happened, the segment
      fills in<span class="dl-desktop-only"> — no logging, no nagging</span>.
    </p>

    <div class="hero-actions">
      @if ($isAuthenticated()) {
        <a pButton routerLink="/app" size="large" class="hero-btn">Open app</a>
      } @else {
        <a pButton routerLink="/register" size="large" class="hero-btn">Plan tomorrow</a>
      }
      <a pButton routerLink="/" fragment="sources" [outlined]="true" severity="secondary" size="large"
         class="hero-btn hero-btn--ghost">See an example day</a>
    </div>

    <div class="hero-clock reveal">
      <app-day-clock class="hero-clock-desktop" [habits]="exampleDay" />
      <app-day-clock class="hero-clock-mobile" [habits]="exampleDay" [compact]="true" />
    </div>
  </div>
</section>
