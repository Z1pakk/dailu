<section id="integrations" class="integrations landing-section--canvas" aria-labelledby="integrations-title">
  <div class="section-inner integrations-inner reveal">
    <h2 id="integrations-title" class="integrations-title dl-eyebrow">
      Checks come from<span class="dl-desktop-only"> the apps you already use</span>
    </h2>
    <ul class="integrations-list">
      @for (name of live; track name) {
        <li class="chip"><span class="chip-dot" aria-hidden="true"></span>{{ name }}</li>
      }
      <li class="chip chip--soon"><span class="chip-dot" aria-hidden="true"></span>More integrations · soon</li>
    </ul>
  </div>
</section>
