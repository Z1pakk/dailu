# Egress proxy for the Dailu dev container.
# Allows only HTTPS (CONNECT to port 443) to hosts in the active allowlist, and checks the TLS server name (SNI) too.
# Everything is passed through without decrypting, except github.com and api.github.com: those are decrypted with
# the local egress CA (see entrypoint.sh) so that only the Z1pakk/devhabit repository is reachable.

http_port 3128 ssl-bump tls-cert=/var/lib/egress-ca/ca.crt tls-key=/var/lib/egress-ca/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=4MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/spool/squid/ssl_db -M 4MB
sslcrtd_children 3 startup=1 idle=1
# The connection from the proxy to GitHub still checks GitHub's real certificate
tls_outgoing_options default-ca=on

acl CONNECT method CONNECT
acl SSL_port port 443
acl allowed_hosts dstdomain -n "/etc/squid/active-allowlist.txt"
acl allowed_sni ssl::server_name "/etc/squid/active-allowlist.txt"
acl github_sni ssl::server_name github.com api.github.com
acl step1 at_step SslBump1

# Requests inside the decrypted GitHub connections
acl github_hosts dstdomain github.com api.github.com
# git fetch / pull / push for Z1pakk/devhabit only (GitHub treats owner and repo names case-insensitively)
acl github_repo url_regex -i ^https://github\.com(:443)?/Z1pakk/devhabit(\.git)?/(info/refs|git-upload-pack|git-receive-pack)(\?|$)
# Rider and VS Code check the signed-in GitHub account here
acl github_user url_regex ^https://api\.github\.com(:443)?/user$

# Tunnels: HTTPS to allowlisted hosts only
http_access deny CONNECT !SSL_port
http_access allow CONNECT allowed_hosts
http_access deny CONNECT
# Decrypted GitHub requests: only the URLs above
http_access allow github_hosts github_repo
http_access allow github_hosts github_user
http_access deny all

ssl_bump peek step1
ssl_bump bump github_sni
ssl_bump splice allowed_sni
ssl_bump terminate all

# English error pages only: git sends "Accept-Language: c" (from LANG=C.UTF-8), which has no page and logs an error
error_directory /usr/share/squid/errors/en

cache deny all
access_log stdio:/var/log/squid/access.log
cache_log stdio:/var/log/squid/cache.log
