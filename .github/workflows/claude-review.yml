name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on new/ready PRs, or when a maintainer/collaborator comments "@claude" on a PR
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Review this pull request.
            Read .github/claude-review.md and follow those review guidelines exactly.

            Steps:
            1. Check CI status with `gh pr checks <PR NUMBER>`. If the build
               or tests are failing, lead the summary comment with that fact.
            2. Read the diff with `gh pr diff <PR NUMBER>`.
            3. Post each concrete issue as an inline comment on the exact line.
            4. ALWAYS finish by posting exactly one summary comment with
               `gh pr comment <PR NUMBER> --body "..."`, using the summary
               template from the guidelines. Do this even if there are no issues.
          # Allow Claude to read the diff and CI status, and post inline + summary comments
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*)"
